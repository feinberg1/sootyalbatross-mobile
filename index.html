<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save the Sooty Albatross! A Species Survival Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#1b2133;--paper:#171c2b;--card:#222a40;--card2:#2a3350;--ink:#eef0f8;--soft:#a3abc4;--pink:#ff8fb1;--pinkd:#ff8fb1;--mint:#5fd3a5;--mintd:#4cc994;--gold:#ffd166;--red:#ef5b5b;--line:#05070d;--edge:#3a4463;--dark:#141826}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#123555;color:var(--ink);font-family:Nunito,system-ui,sans-serif}
a{color:#8fc8ff}
.pix{font-family:"Press Start 2P",monospace;letter-spacing:.5px}
img.sprite{image-rendering:pixelated;image-rendering:crisp-edges}
img.sprite,img.photo{pointer-events:none;user-select:none;-webkit-user-drag:none}
#stage{position:fixed;left:0;top:0;height:600px;transform-origin:0 0}
.scene{position:absolute;inset:0;display:none}.scene.on{display:block}
.scene canvas{position:absolute;left:0;top:0;image-rendering:pixelated}
.ent{position:absolute;left:0;top:0;will-change:transform;cursor:pointer}
.ent img{display:block}
.ent .tag{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font:800 10px Nunito;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:6px;padding:1px 5px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;z-index:3}
.ent:hover .tag{opacity:1}
.mk::after{position:absolute;right:-8px;top:-10px;width:18px;height:18px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;animation:bob 1s infinite}
.threat::after{content:"!";font:10px "Press Start 2P";color:#fff;background:var(--red)}
.friend::after{content:"?";font:9px "Press Start 2P";color:#1b1f2b;background:var(--gold)}
.mk.read::after{content:"\2713";background:var(--mintd);color:#0b1a14;animation:none;font:800 11px Nunito}
.quiet::after{display:none}
.arrive{animation:arrive .7s}
@keyframes arrive{0%{opacity:0;filter:brightness(3)}60%{opacity:1;filter:brightness(1.6)}100%{filter:none}}
.dots{display:flex;gap:6px}.dots span{width:10px;height:10px;border-radius:50%;border:2px solid var(--edge);background:var(--card)}.dots span.on{background:var(--pink);border-color:var(--pink)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.chick img{filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.chick.shake img{animation:wob .25s infinite}
@keyframes wob{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(2px) rotate(2deg)}}
.chick.sick img{filter:sepia(.6) hue-rotate(45deg) saturate(1.5) brightness(.9)}
.islandBtn{position:absolute;z-index:10;font:9px "Press Start 2P";color:var(--ink);background:var(--cream);border:3px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;box-shadow:3px 3px 0 var(--line);white-space:nowrap;line-height:1.5}
.islandBtn:hover{background:var(--card2)}
.islandBtn small{display:block;font:800 10px Nunito;color:var(--pink)}
.banner{position:absolute;z-index:10;background:rgba(23,28,43,.92);color:var(--ink);border:3px solid var(--line);border-radius:10px;padding:5px 9px;box-shadow:3px 3px 0 var(--line);max-width:330px}
.banner h3{margin:0;font:9px "Press Start 2P";line-height:1.6;color:var(--gold)}
.banner p{margin:2px 0 0;font-size:10.5px;line-height:1.3}
.float{position:absolute;font:9px "Press Start 2P";color:#fff;text-shadow:2px 2px 0 var(--line);pointer-events:none;animation:rise 1.4s forwards;white-space:nowrap;z-index:4}
@keyframes rise{to{transform:translateY(-34px);opacity:0}}
.foot{position:absolute;font:800 11px Nunito;color:#dfe6f5;background:rgba(5,10,20,.7);padding:5px 9px;border-radius:8px;pointer-events:none}

header{position:fixed;left:12px;right:12px;top:10px;display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(23,28,43,.95);border:3px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--line);flex-wrap:wrap;z-index:50}
.badge{width:50px;height:50px;border:3px solid var(--line);border-radius:10px;background:#2c3b2a;display:grid;place-items:center;overflow:hidden}
.badge img{height:46px}
.titles h1{margin:0;font-size:14px;line-height:1.5;color:var(--gold)}
.titles p{margin:1px 0 0;font-size:12.5px;color:var(--soft)}
.stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.stat{background:var(--card);border:3px solid var(--line);border-radius:10px;padding:4px 10px;min-width:118px}
.stat .lab{font-size:10.5px;color:var(--soft);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.stat .val{font-family:"Press Start 2P",monospace;font-size:15px;margin-top:3px}
.stat .trend{font-size:11.5px;font-weight:800;margin-top:1px}
.down{color:#ff7b7b}.up{color:var(--mintd)}
.scene>.hbtn{position:absolute;z-index:12}
.hbtn{font:800 13px Nunito;border:3px solid var(--line);background:var(--gold);border-radius:10px;padding:7px 11px;cursor:pointer;box-shadow:3px 3px 0 var(--line);color:#1b1f2b}
.hbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.hbtn.w{background:var(--card2);color:var(--ink)}
.xbtn{position:absolute;z-index:12;width:46px;height:46px;border:3px solid var(--line);border-radius:50%;background:var(--red);color:#fff;font:900 22px Nunito;line-height:1;cursor:pointer;box-shadow:3px 3px 0 var(--line);display:grid;place-items:center;padding:0}
.xbtn:hover{background:#ff7676}
.xbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
#panel{position:fixed;left:12px;width:340px;bottom:12px;background:rgba(23,28,43,.95);border:3px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--line);display:flex;flex-direction:column;z-index:40}
#panel .top{padding:10px 12px 8px;border-bottom:3px dashed var(--edge)}
#panel h2{margin:0;font-size:11px;line-height:1.6;color:var(--gold)}
.prog{height:14px;border:3px solid var(--line);border-radius:8px;margin-top:6px;background:var(--dark);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--mint) 0 8px,#8de6c3 8px 16px);transition:width .4s}
.hint{font-size:12px;color:var(--soft);margin:5px 0 0}
#probs{overflow:auto;padding:10px;flex:1}
.prob{border:3px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden;background:var(--card)}
.prob .ph{background:#4a2330;padding:7px 10px;cursor:pointer}
.prob.solved .ph{background:#1f4a3a}
.prob .ph b{font-size:13px}
.prob .ph p{margin:2px 0 0;font-size:11.5px;color:#d7d9e6;line-height:1.35}
.prob .pb{padding:6px 9px 8px;border-top:3px solid var(--line);font-size:12px}
.sol{display:flex;gap:6px;align-items:flex-start;margin-top:5px;line-height:1.35}
.sol .st{flex:none;width:16px;text-align:center;font-weight:800}
.sol.on .st{color:var(--mintd)}.sol.wait{opacity:.6}
.type{font:800 9px Nunito;text-transform:uppercase;letter-spacing:.4px;border:2px solid var(--line);border-radius:5px;padding:0 4px;background:#fff;color:#1b1f2b;white-space:nowrap}
.t-insitu{background:#a8ebcf}.t-exsitu{background:#cdbfff}.t-law{background:#ffc3ad}.t-incentive{background:#ffe38f}.t-enforce{background:#ffb3cb}.t-fund{background:#aedcff}.t-partner{background:#d3ef9c}.t-gov{background:#e6d0b3}
.prob.locked{border-style:dashed;border-color:var(--edge);background:transparent}
.prob.locked .ph{background:rgba(34,42,64,.6);color:var(--soft);cursor:default}
.minibar{height:6px;background:var(--dark);border-radius:4px;overflow:hidden;margin-top:3px}.minibar i{display:block;height:100%;background:var(--mint)}
#toastEl{position:fixed;bottom:22px;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:10px;padding:8px 12px;font:800 13px Nunito;box-shadow:3px 3px 0 var(--line);z-index:60;max-width:520px;text-align:center;display:none;transform:translateX(-50%)}


#modal,#over{position:fixed;inset:0;background:rgba(3,6,14,.6);display:none;align-items:center;justify-content:center;z-index:500;padding:16px}
#modal.on,#over.on{display:flex}
.box{background:var(--paper);color:var(--ink);border:4px solid var(--line);border-radius:18px;box-shadow:7px 7px 0 var(--line);max-width:660px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
.box .head{display:flex;gap:14px;align-items:center}
.box .pic{width:96px;height:96px;border:3px solid var(--line);border-radius:12px;background:#2a4d6e;display:grid;place-items:center;flex:none;overflow:hidden}
.box .pic img{width:84px;height:84px;object-fit:contain}
.box h2{font-size:13px;line-height:1.6;margin:0;color:var(--gold)}
.box .kind{font:800 11px Nunito;text-transform:uppercase;letter-spacing:.7px;color:var(--pink)}
.idcard{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.idcard span{font:800 12px Nunito;background:var(--card2);border:2px solid var(--line);border-radius:8px;padding:3px 8px}
.idcard span.bad{background:#5a2633}
.box h4{margin:14px 0 4px;font:9px "Press Start 2P";line-height:1.6;color:var(--gold)}
.box ul{padding-left:18px;margin:8px 0;font-size:14.5px;line-height:1.55}
.box li{margin-bottom:6px}
.box b{color:#fff}
.found{background:#3a1f2a;border:3px dashed var(--red);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.found.ok{background:#173a2f;border-color:var(--mintd)}
.found h4{margin:0 0 4px}
.found .done{color:var(--mintd)}
.src{font-size:12px;color:var(--soft);margin-top:10px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
textarea{width:100%;height:260px;font:13px/1.4 Nunito;border:3px solid var(--line);border-radius:10px;padding:8px;background:var(--dark);color:var(--ink)}
.credits{font-size:13px;line-height:1.5}
.note{font-size:12px;color:var(--soft)}
.hero,.ph2 figure,.side figure{margin:0}
.hero img,.ph2 img,.side img{display:block;width:100%;border:3px solid var(--line);border-radius:12px;object-fit:cover}
.hero img{height:230px}
.ph2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}.ph2 img{height:190px}
.side{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}.side img{height:300px}
.cap{font-size:11px;color:var(--soft);margin:4px 2px 8px}
@media (max-width:600px){.side{grid-template-columns:1fr}.ph2{grid-template-columns:1fr}}
.chev{display:none;float:right;font-size:10px}
body.mob header{left:6px;right:6px;top:6px;padding:6px 8px;gap:6px;border-width:2px;box-shadow:2px 2px 0 var(--line)}
body.mob .badge{display:none}
body.mob .titles{flex:1 1 100%}
body.mob .titles h1{font-size:11px;text-align:center}
body.mob .titles p{display:none}
body.mob .stats{margin-left:0;width:100%;gap:5px;flex-wrap:nowrap}
body.mob .stat{min-width:0;flex:1 1 0;padding:3px 6px;border-width:2px}
body.mob .stat .lab{font-size:9px}
body.mob .stat .val{font-size:11px}
body.mob .stat .trend{font-size:9.5px}
body.mob .hbtn{font-size:11px;padding:5px 7px;border-width:2px;box-shadow:2px 2px 0 var(--line)}
body.mob .stats .hbtn{flex:0 0 auto}
body.mob #panel{left:6px;right:6px;width:auto;top:auto;bottom:6px;border-width:2px;max-height:none}
body.mob #panel .top{cursor:pointer;border-bottom:none;padding:8px 10px}
body.mob .chev{display:inline}
body.mob #probs{display:none}
body.mob #panel.open #probs{display:block;max-height:58vh;max-height:58dvh}
body.mob #panel.open .top{border-bottom:3px dashed var(--edge)}
body.mob .hint{font-size:11px}
body.mob .banner{max-width:calc(100% - 90px)}
body.mob .islandBtn{font-size:8px;padding:5px 6px}
body.mob #modal,body.mob #over{padding:8px;align-items:flex-end}
body.mob .box{padding:14px;border-width:3px;max-height:92vh;max-height:92dvh;border-radius:14px}
body.mob .box ul{font-size:13.5px;padding-left:16px}
body.mob .box .pic{width:64px;height:64px}.mob .box .pic img{width:56px;height:56px}
body.mob .box h2{font-size:11px}
body.mob .hero img{height:170px}
body.mob .side{grid-template-columns:1fr}body.mob .side img{height:220px;object-position:center 80%}
body.mob .ph2 img{height:140px}
body.mob #toastEl{max-width:90vw;font-size:12px}
html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sm{display:none}body.mob .sm{display:inline}body.mob .lg{display:none}
body.short .titles{display:none}body.short .hint{display:none}body.short #panel .top{padding:5px 10px}body.short .prog{margin-top:3px;height:10px}
</style>
</head>
<body>
<div id="stage"></div>
<header id="hdr">
  <div class="badge"><img class="photo" id="badgeImg" alt="Fluffy albatross chick"></div>
  <div class="titles"><h1 class="pix">SAVE THE SOOTY ALBATROSS</h1><p>A Species Survival Plan for the Sooty Albatross (<i>Phoebetria fusca</i>) · Prince Edward Islands</p></div>
  <div class="stats">
    <div class="stat"><div class="lab"><span class="lg">Breeding adults</span><span class="sm">Adults</span></div><div class="val" id="pop">5,328</div><div class="trend down" id="trend">▼ falling</div></div>
    <div class="stat"><div class="lab">Time</div><div class="val" id="time">Yr 0</div><div class="trend" id="timeSub" style="color:var(--soft)">1 sec = 1 month</div></div>
    <button class="hbtn" id="howBtn"><span class="lg">How to play</span><span class="sm">Intro</span></button>
    <button class="hbtn w" id="planBtn"><span class="lg">Plan as text</span><span class="sm">Plan</span></button>
    <button class="hbtn w" id="creditBtn">Sources</button>
  </div>
</header>
<aside id="panel" aria-label="Species Survival Plan">
  <div class="top" id="panelTop"><h2 class="pix">MY SURVIVAL PLAN <span class="chev" id="chev">▲</span></h2><div class="prog"><i id="progBar"></i></div><p class="hint" id="progTxt"></p></div>
  <div id="probs"></div>
</aside>
<div id="toastEl"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div id="over" role="dialog" aria-modal="true"><div class="box" id="overBox"></div></div>

const FACT={
 hab:['Where it lives','Sooty Albatrosses nest on remote islands in the southern Atlantic and Indian Oceans, including South Africa\'s Prince Edward Islands (Marion Island and Prince Edward Island). When they are not nesting, they fly over the open ocean anywhere from South America to Australia.'],
 food:['What it eats & its climate','They eat mostly squid, along with crustaceans, fish and dead animals floating at sea. Their home is the Southern Ocean, which is cold, windy and wet for most of the year, and on the islands they build their nests in the tussock grass on foggy slopes.'],
 why:['Why albatrosses matter','Albatrosses sit near the top of the ocean food chain, so when their numbers drop it usually means something is wrong in the ocean as a whole. Their droppings also bring nutrients from the sea onto the islands, which feeds the plants there. Since people caused almost all of the threats they face, people are also in the best position to fix them.'],
 status:['Status','The IUCN lists the Sooty Albatross as Endangered because its population has fallen quickly, mostly because of fishing.'],
 life:['A long, slow life','Albatrosses are some of the longest-living birds in the world. A single generation of Sooty Albatrosses is about 30 years, and related albatrosses have been recorded breeding after age 50. Young birds spend several years at sea before they return to breed, and once they pair up they usually stay with the same mate for life, laying one egg every other year.'],
 chick:['Life on the nest','After the chick hatches, it stays on the nest for months while both parents take turns flying far out to sea to bring back food.'],
 surv:['K-selected species','Sooty Albatrosses are K-selected, which means they live a long time, start breeding late, have very few young and put a lot of care into each one. Species like this can\'t bounce back quickly, so every adult killed by people is a serious loss for the colony.'],
 hot:['Biodiversity hotspot?','The Prince Edward Islands are not inside any of Conservation International\'s 36 biodiversity hotspots. They are still protected, though, since South Africa made them a Special Nature Reserve in 2003 and protected 180,000 km² of the ocean around them in 2013.'],
 esa:['ESA, CITES & ACAP','The Sooty Albatross is not listed under the U.S. Endangered Species Act because it doesn\'t live in the United States, and it isn\'t listed under CITES because it isn\'t traded. It is protected by ACAP (the Agreement on the Conservation of Albatrosses and Petrels), an international treaty that South Africa belongs to, and all albatrosses are listed on Appendix II of the Convention on Migratory Species.'],
 src:['Sources','ACAP Breeding Site Database (Marion and Prince Edward Island). ACAP, Summary Advice for Reducing Impact of Pelagic Longlines on Seabirds. BirdLife International, Sooty Albatross Species Factsheet, 2024. BirdLife South Africa, "Longline fishing" and Red List, 2025. SANBI Red List of South African Species. Mouse-Free Marion Project, mousefreemarion.org. Te Ara Encyclopedia of New Zealand, "Albatrosses." Wikipedia, "Prince Edward Islands" and "Sooty albatross."'],
};

function stepBird(b,dt){b.ph+=dt*3;
  if(b.state==='hooked'){b.y+=dt*28;b.op=(b.op??1)-dt*.6;b.el.style.opacity=b.op;b.img.style.filter='grayscale(1)';if(b.op<=0){b.alive=false;b.el.remove()}place(b);return}

function clump(c,cx,base,s,seed,pal){
  // dark mound
  const mh=s*.45;for(let dy=0;dy<mh;dy++){const hw=s*.75*Math.sqrt(1-(dy/mh)**2);for(let dx=-hw;dx<=hw;dx++){const x=Math.round(cx+dx),y=Math.round(base-dy);if(x>=0&&x<GW&&y>=0)px(c,x,y,hash(x,y)<.5?pal[0]:'#1a3317')}}
  // fountain of blades curving outward
  const n=Math.round(s*1.5);for(let b=0;b<n;b++){const u=(b/(n-1))*2-1,x0=cx+u*s*.35,h=s*(1.0+hash(b*7,seed)*.9)*(1-Math.abs(u)*.35),dir=u+(hash(b,seed*5)-.5)*.5;
    for(let k=0;k<h;k++){const f=k/h,x=Math.round(x0+dir*f*f*s*.95),y=Math.round(base-mh*.5-k+f*f*h*.18*Math.abs(dir));
      const col=f<.3?pal[1]:f<.7?pal[2]:f<.9?pal[3]:pal[4];if(y>=0&&x>=0&&x<GW)px(c,x,y,col)}}}
const TUS=[['#22401e','#2f5d2a','#4f8a3c','#7fb04f','#c9c77e'],['#24441f','#386630','#5c9744','#8cbc58','#d6cf8a'],['#1f3c1c','#2c5526','#467f36','#76a64a','#b9b86c']];
function drawIsland(c,id){const sky=Math.round(T0/4)+(id==='marion'?20:12),SEA=Math.floor(BOT/4)-(MOB?3:12);
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){let col;
    if(j<sky){col=j<sky*.45?'#8fc7ef':'#b7dcf5';if(id==='pei')col=j<sky*.5?'#b9cbd8':'#cfdae3';if(hash(i>>3,j>>1)>.9&&j<sky*.5)col='#f2f6fa'}
    else col=hash(i,j)<.5?'#2b3a20':'#33452a';if(j>=sky&&hash(i>>1,j>>1)>.8)col='#3f5a2e';px(c,i,j,col)}
  if(id==='marion'){const pk=GW*.6,pk2=GW*.82;
    for(let i=0;i<GW;i++){const top=sky-40+Math.abs(i-pk)*.42+Math.sin(i*.35)*1.3,top2=sky-28+Math.abs(i-pk2)*.5+Math.sin(i*.5),top3=sky-22+Math.abs(i-GW*.25)*.38;
      const t=Math.min(top,top2,top3);for(let j=Math.max(0,Math.floor(t));j<sky+2;j++){let col;
        if(j>=top){col=hash(i,j)<.5?'#7a7d88':'#6a6d78';if(j<top+5+hash(i,3)*4)col=hash(i,j)<.8?'#f4f7fa':'#dde5ec';if(j>sky-8)col=hash(i,j)<.5?'#5d7a4a':'#6b8a52'}
        else if(j>=top2){col=hash(i,j)<.5?'#8a5a48':'#9a6a52';if(j<top2+3)col='#e9eef2'}
        else col=hash(i,j)<.5?'#6a8a55':'#5b7a4a';px(c,i,j,col)}}}
  else{for(let i=0;i<GW;i++){px(c,i,sky-3,'#7da5c2');px(c,i,sky-2,'#6a95b6');px(c,i,sky-1,hash(i,1)<.5?'#5d89ab':'#7da5c2')}}
  for(let y=sky+6,ri=0;y<SEA;ri++){const s=7+(y-sky)/(SEA-sky)*11;for(let x=-6+(ri%2)*s*.7;x<GW+8;x+=s*1.55){clump(c,x+(hash(x,y)-.5)*s*.5,y+hash(y,x)*3,s*(.85+hash(x*3,y)*.3),(Math.round(x)*13+y*7)%997,TUS[(((ri+Math.floor(x))%3)+3)%3])}y+=s*.62}
  for(let j=SEA;j<GH;j++)for(let i=0;i<GW;i++)px(c,i,j,j===SEA?(hash(i,2)<.6?'#e8f4fb':'#3a6f9f'):(hash(i,j>>1)<.08?'#3a6f9f':'#1f4f80'))}
let MAR,PEI,mice,station,germs,supply,crate,stow;
function nestGrid(id){const narrow=W<600,tight=!narrow&&(BOT-T0)<380,n=id==='marion'?15:7,rows=id==='marion'?(narrow?[3,3,3,3,3]:tight?[8,7]:[5,5,5]):(narrow?[3,2,2]:[4,3]),aw=W-L0,top=T0+(BOT-T0)*(id==='marion'?(narrow?.26:.36):(narrow?.28:.34)),bot=BOT-(narrow?70:95),out=[];
  const right=narrow?W-40:W-(id==='marion'?230:340);rows.forEach((cnt,ri)=>{const y=rows.length===1?bot:top+(bot-top)*(ri/(rows.length-1));
    for(let k=0;k<cnt;k++){const x=narrow?40+(right-130)*(cnt===1?.5:k/(cnt-1))+(cnt<3?(right-130)*.25:0)+(ri%2?20:0):L0+70+(right-L0-110)*(cnt===1?.5:k/(cnt-1))+(ri%2?40:0);out.push([x+rnd(-12,12),y+rnd(-8,8)])}});return out.slice(0,n)}
function buildIsland(id){const sc=mkScene(id);drawIsland(sc.bg,id);sc.nests=[];
  nestGrid(id).forEach(([x,y],i)=>{const n=ent(sc,{type:'nest',src:NEST.src,w:NEST.w*2.7,h:NEST.h*2.7,x,y:y+24,cls:''});n.el.style.cursor='default';place(n);
    const tight=!(W<600)&&(BOT-T0)<380,[cs,[cw,ch]]=SPR.bchick,s=rnd(.25,.29)*(tight?.72:1),w=cw*s,h=ch*s;
    const c=ent(sc,{type:'chick',photo:true,src:cs,w,h,x,y:y+5-h/2+14,cls:'chick',tag:'Albatross chick',flip:Math.random()<.5,idx:i+1,isl:id,months:Math.floor(rnd(1,5)),click:clickChick});place(c);sc.nests.push({x,y,chick:c})});
  const b=el(sc,'div','banner',id==='marion'?'<h3>MARION ISLAND</h3><p>A big volcanic island with mountains rising behind the tussock grass. About 1,454 pairs of Sooty Albatrosses nested here in 2023.</p>':'<h3>PRINCE EDWARD ISLAND</h3><p>A smaller, lower island about 22 km northeast of Marion that is often covered in fog. There are no mice here, and about 1,210 pairs of Sooty Albatrosses were counted in 2009.</p>',L0+10,T0+6);
  if(!MOB)el(sc,'button','hbtn','◂ Back to map',W-210,T0+8,()=>go('map'));
  el(sc,'button','xbtn','✕',W-58,T0+6,()=>go('map')).title='Close and go back to the map';
  return sc}
function buildIslands(){MAR=buildIsland('marion');PEI=buildIsland('pei');const aw=W-L0;
  const[ms,[mw,mh]]=SPR.mouse;mice=[];for(let i=0;i<6;i++)mice.push(ent(MAR,{type:'mouse',src:ms,w:mw*2.4,h:mh*2.4,cls:'mk threat'+(i?' quiet':''),readKey:'mice',tag:'House mouse',face:-1,x:rnd(L0+40,MOB?W-100:W-260),y:rnd(T0+(BOT-T0)*.35,BOT-90),tgt:null,click:()=>openThreat('mice',ms)}));
  station=ent(MAR,{type:'station',src:STATION.src,w:STATION.w*3,h:STATION.h*3,cls:'mk friend',readKey:'station',tag:'Research station',x:MOB?W-45:W-110,y:MOB?T0+(BOT-T0)*.35:BOT-200,click:()=>openHelper('station')});
  germs=[[.3,.5],[.6,.65]].map(([fx,fy])=>ent(PEI,{type:'germ',src:GERM.src,w:GERM.w*3,h:GERM.h*3,cls:'mk threat',readKey:'disease',tag:'Avian cholera',bx:L0+aw*fx,by:T0+(BOT-T0)*fy,click:()=>openThreat('disease',GERM.src)}));
  supply=ent(PEI,{type:'supply',src:SUPPLY.src,w:SUPPLY.w*3.4,h:SUPPLY.h*3.4,tag:'Supply ship',x:MOB?W*.5:W-330,y:BOT-34});if(MOB)supply.el.style.visibility='hidden';
  crate=ent(PEI,{type:'crate',src:CRATE.src,w:CRATE.w*3.4,h:CRATE.h*3.4,cls:'mk threat',readKey:'stowaway',tag:'Cargo crate',x:MOB?W-45:W-200,y:BOT-(MOB?40:90),click:()=>openThreat('stowaway',SPR.mouse[0])});
  stow=ent(PEI,{type:'stow',src:SPR.mouse[0],w:SPR.mouse[1][0]*2.2,h:SPR.mouse[1][1]*2.2,x:MOB?W-40:W-195,y:BOT-(MOB?68:118),click:()=>openThreat('stowaway',SPR.mouse[0])});
  [station,supply,crate,stow,...germs,...mice].forEach(place);spawnHelpers(MAR);spawnHelpers(PEI);showHelpers()}
function stepIsland(sc,dt){stepHelpers(sc,dt);const id=sc.id,show=Math.round(sc.nests.length*Math.min(1,S.pop/S.start));sc.nests.forEach((n,i)=>n.chick.el.style.display=i<show?'':'none');
  sc.pt=(sc.pt??3)-dt;if(sc.pt<0){sc.pt=rnd(3,6);const vis=sc.nests.filter((n,i)=>i<show);if(vis.length){const n=pick(vis),[ps,[pw,ph]]=SPR.portrait;
    const p=ent(sc,Object.assign({type:'parent',src:ps,w:pw*.85,h:ph*.85,tag:'Parent feeding its chick',x:n.x+38,y:n.y+6,click:clickBird,state:'nest',baseSrc:ps},newBirdId(),{home:id,age:Math.floor(rnd(9,40))}));
    place(p);setTimeout(()=>{p.el.remove();sc.ents=sc.ents.filter(e=>e!==p)},4200);floatTxt(sc,n.x,n.y-20,'FOOD!')}}
  if(id==='marion'){const vis=Math.round(mice.length*(1-fixFrac('mice')));
    mice.forEach((m,i)=>{m.el.style.display=i<vis?'':'none';if(i>=vis)return;m.ph+=dt*10;
      if(!m.tgt){const ns=sc.nests.filter((n,k)=>k<show);m.tgt=Math.random()<.6&&ns.length?{nest:pick(ns)}:{x:rnd(L0+40,MOB?W-100:W-260),y:rnd(T0+(BOT-T0)*.35,BOT-80)};if(m.tgt.nest){m.tgt.x=m.tgt.nest.x+20;m.tgt.y=m.tgt.nest.y+34}}
      const dx=m.tgt.x-m.x,dy=m.tgt.y-m.y,d=Math.hypot(dx,dy);
      if(d<5){if(m.tgt.nest){const nn=m.tgt.nest;nn.chick.el.classList.add('shake');m.wait=1.6;setTimeout(()=>nn.chick.el.classList.remove('shake'),1600);if(Math.random()<.4)floatTxt(sc,nn.x,nn.y-40,'EEK!')}m.tgt=null}
      else if((m.wait=(m.wait||0)-dt)<0){m.x+=dx/d*40*dt;m.y+=dy/d*40*dt+Math.sin(m.ph)*.3}m.flip=(dx>0)!==(m.face>0);place(m)});
    }
  else{const fd=fixFrac('disease');germs.forEach((g,i)=>{g.ph+=dt*1.4;g.x=g.bx+Math.cos(g.ph*.6+i)*60;g.y=g.by+Math.sin(g.ph)*18;g.el.style.opacity=1-fd*.75;g.el.style.display=fd>=1?'none':'';place(g)});
    sc.nests.forEach((n,i)=>n.chick.el.classList.toggle('sick',fd<1&&(i===1||i===5)));
    stow.el.style.display=fixFrac('stowaway')>=1?'none':'';stow.ph+=dt*3;stow.y=BOT-(MOB?68:118)-Math.max(0,Math.sin(stow.ph))*6;place(stow);supply.ph+=dt*1.5;supply.y=BOT-34+Math.sin(supply.ph)*2;place(supply)}}


/* ===== helpers (one per solution, appear after their problem is found) ===== */
function helperSpot(sc,k,i){const ah=BOT-T0;
  if(MOB){const R=W-45,P={map:{atf:[W*.28,T0+ah*.1],delegate:[W*.72,T0+ah*.05],buyer:[W*.3,BOT-45],patrol:[W*.72,BOT-80],diplomat:[W*.72,T0+ah*.3],sat:[W-40,T0+ah*.2]},
      marion:{heli:[W*.55,T0+40],funder:[R,T0+ah*.6],birdlife:[R,T0+ah*.82]},
      pei:{vet:[R,T0+ah*.12],labsci:[R,T0+ah*.3],official:[R,T0+ah*.48],liaison:[R,T0+ah*.66],ranger:[W-105,BOT-35]}};return P[sc.id][k]}
  const P={map:{atf:[L0+(W-L0)*.2,T0+ah*.18],delegate:[L0+(W-L0)*.55,T0+ah*.08],buyer:[L0+(W-L0)*.15,BOT-90],patrol:[L0+(W-L0)*.7,BOT-110],diplomat:[L0+(W-L0)*.85,T0+ah*.45],sat:[W-70,T0+ah*.3]},
    marion:{heli:[W-170,T0+80],funder:[W-190,BOT-110],birdlife:[W-80,T0+ah*.42]},
    pei:{vet:[W-170,T0+ah*.36],labsci:[W-270,T0+ah*.5],ranger:[W-110,BOT-100],official:[W-60,T0+130],liaison:[W-60,T0+ah*.62]}};
  return P[sc.id][k]}
function spawnHelpers(sc){for(const k in HELPERS){const Hh=HELPERS[k];if(Hh.scene!==sc.id)continue;const G=SPRITES[k],s=Hh.boat?2.6:(k==='heli'||k==='sat'?3:3.2),[x,y]=helperSpot(sc,k);
  const e=ent(sc,{type:'helper',helper:k,src:G.src,w:G.w*s,h:G.h*s,cls:'mk friend',readKey:k,tag:Hh.name,x,y,bx:x,by:y,dir:Math.random()<.5?1:-1,click:()=>openHelper(k)});e.el.style.display='none';place(e)}}
function stepHelpers(sc,dt){sc.ents.forEach(e=>{if(e.type!=='helper'||e.el.style.display==='none')return;const k=e.helper;e.ph+=dt;
  if(HELPERS[k].boat){e.x+=e.dir*16*dt;const rg=MOB?45:120;if(e.x>e.bx+rg||e.x<e.bx-rg)e.dir*=-1;e.y=e.by+Math.sin(e.ph*2)*2;e.flip=k==='atf'||k==='patrol'?e.dir<0:e.dir>0}
  else if(k==='heli'){e.x=e.bx+Math.sin(e.ph*.5)*(MOB?30:60);e.y=e.by+Math.sin(e.ph*1.7)*6;e.flip=Math.cos(e.ph*.5)>0}
  else if(k==='sat'){e.y=e.by+Math.sin(e.ph)*8}
  else{e.y=e.by+Math.abs(Math.sin(e.ph*2.2))*-3}
  place(e)})}

  return new Promise(res=>{$('okBtn').onclick=()=>{$('modal').classList.remove('on');S.paused=false;last=performance.now();res()}})}

const head=(img,kind,title,photo)=>`<div class="head"><div class="pic"><img class="${photo?'photo':'sprite'}" src="${img}" alt=""></div><div><div class="kind">${kind}</div><h2 class="pix">${title}</h2></div></div>`;

const facts=ks=>`<ul>${ks.map(k=>`<li><b>${FACT[k][0]}:</b> ${FACT[k][1]}</li>`).join('')}</ul>`;

const THREATSRC={bycatch:[['BirdLife South Africa: Longline fishing','https://www.birdlife.org.za/?p=20629'],['ACAP pelagic longline advice','https://www.bmis-bycatch.org/system/files/zotero_attachments/library_1/FAVC9W4W%20-%20ACAP%202014%20PELAGIC%20LL%20Mitigation%20Review%20%26%20Advice_e.pdf']],
 mice:[['Mouse-Free Marion Project','https://mousefreemarion.org/'],['BirdLife South Africa Red List','https://www.birdlife.org.za/red-list/sooty-albatross/']],
 warming:[['News24 / Mouse-Free Marion','https://www.news24.com/fin24/climate_future/solutions/sa-plans-biggest-ever-island-mouse-hunt-as-seabirds-are-killed-off-20240309']],
 disease:[['Wikipedia: Sooty albatross','https://en.wikipedia.org/wiki/Sooty_albatross']],stowaway:[['Mouse-Free Marion Project','https://mousefreemarion.org/']]};
function solRow(s){const st=S.sol[s[0]],H=HELPERS[s[5]];
  const status=st.state==='done'?'<b class="done">✓ In action</b>':st.state==='rolling'?`<b>Being put in place: ${fmtM(s[4]-st.m)} left</b>`:`<i>Find the ${H.name}${H.scene==='map'?' (at sea)':H.scene==='marion'?' (on Marion)':' (on Prince Edward)'}</i>`;
  return `<li><span class="type t-${s[1]}">${TYPES[s[1]]}</span> <b>${st.state==='none'?'???':s[2]}</b> · ${status}${st.state!=='none'?`<br>${s[3]}`:''}</li>`}
function openThreat(p){const P=PROBLEMS[p],isNew=!S.found.has(p);
  modal(head(P.img(),'Danger','PROBLEM: '+P.name.toUpperCase())+`<ul>${P.info.map(([a,b])=>`<li><b>${a}:</b> ${b}</li>`).join('')}</ul>`+
   `<div class="found${fixFrac(p)>=1?' ok':''}"><h4 class="pix">${isNew?'NEW PROBLEM ADDED TO YOUR PLAN':fixFrac(p)>=1?'SOLVED!':'SOLUTIONS'}</h4>`+
   (isNew?`<p style="margin:0 0 4px">This problem needs <b>${P.sols.length} solutions</b>, and a helper for each one has just appeared. Find all of them to add their part to your plan.</p>`:'')+
   `<ul>${P.sols.map(solRow).join('')}</ul></div>`+srcs(THREATSRC[p]))
  .then(()=>{const was=S.found.has(p);S.found.add(p);S.read.add(p);markRead();showHelpers();renderPanel();if(!was)toast(`${P.sols.length} helpers have appeared. Look for the yellow ?`)})}
function openHelper(k){
  if(k==='station'){modal(head(STATION.src,'Research station','RESEARCH STATION')+`<ul><li>South African scientists live here all year, counting nests and putting tracking tags on the birds.</li></ul><h4>WHAT THE SCIENTISTS KNOW</h4>`+facts(['hot','esa','src'])+srcs([['ACAP: Marion Island','https://data.acap.aq/breeding_site.cfm?bs_id=1102'],['Wikipedia: Prince Edward Islands','https://en.wikipedia.org/wiki/Prince_Edward_Islands']])).then(()=>{S.read.add('station');markRead()});return}
  const H=HELPERS[k],P=PROBLEMS[H.prob],s=P.sols[H.sol],st=S.sol[s[0]],first=st.state==='none';
  modal(head(SPRITES[k].src,'Helper · "'+P.name+'"',H.name.toUpperCase())+`<ul><li>"${H.say}"</li></ul>`+
    `<div class="found ok"><h4 class="pix">${first?'NEW SOLUTION FOR YOUR PLAN':'ALREADY IN YOUR PLAN'}</h4><p style="margin:0"><span class="type t-${s[1]}">${TYPES[s[1]]}</span> <b>${s[2]}:</b> ${s[3]}</p>
     <p style="margin:6px 0 0"><b>Time to put in place:</b> ${fmtM(s[4])}${s[4]>=24?' (a long-term solution)':s[4]<=6?' (a quick fix)':''}${st.state==='rolling'?` · ${fmtM(s[4]-st.m)} left`:st.state==='done'?' · ✓ in action':''}</p></div>`)
  .then(()=>{if(first){st.state='rolling';toast(`Starting: ${s[2]} (${fmtM(s[4])})`)}S.read.add(k);markRead();renderPanel()})}
function markRead(){Object.values(scenes).forEach(sc=>sc.ents.forEach(e=>{if(e.readKey&&S.read.has(e.readKey))e.el.classList.add('read')}))}
function showHelpers(){Object.values(scenes).forEach(sc=>sc.ents.forEach(e=>{if(e.helper){const on=S.found.has(HELPERS[e.helper].prob);if(on&&e.el.style.display==='none')e.el.classList.add('arrive');e.el.style.display=on?'':'none'}}))}

/* ===== plan panel ===== */
function renderPanel(){let h='';
  for(const p in PROBLEMS){const P=PROBLEMS[p];
    if(!S.found.has(p)){h+=`<div class="prob locked"><div class="ph"><b>??? Undiscovered problem</b><p>Hint: ${P.where}</p></div></div>`;continue}
    const solved=fixFrac(p)>=1;
    h+=`<div class="prob${solved?' solved':''}"><div class="ph" data-p="${p}"><b>${solved?'✓ ':''}${P.name}</b><p>${P.info[2][1]}</p></div><div class="pb">`+
     P.sols.map(s=>{const st=S.sol[s[0]],H=HELPERS[s[5]];
       if(st.state==='none')return `<div class="sol wait"><span class="st">?</span><div><span class="type t-${s[1]}">${TYPES[s[1]]}</span> Find the ${H.name}</div></div>`;
       if(st.state==='done')return `<div class="sol on"><span class="st">✓</span><div><span class="type t-${s[1]}">${TYPES[s[1]]}</span> ${s[2]}</div></div>`;
       return `<div class="sol"><span class="st">⏳</span><div><span class="type t-${s[1]}">${TYPES[s[1]]}</span> ${s[2]} · ${fmtM(s[4]-st.m)} left<div class="minibar"><i style="width:${st.m/s[4]*100}%"></i></div></div></div>`}).join('')+`</div></div>`}
  $('probs').innerHTML=h;$('probs').querySelectorAll('.ph[data-p]').forEach(d=>d.onclick=()=>openThreat(d.dataset.p));
  const total=Object.values(PROBLEMS).reduce((a,P)=>a+P.sols.length,0),done=Object.values(S.sol).filter(x=>x.state==='done').length,solved=Object.keys(PROBLEMS).filter(p=>fixFrac(p)>=1).length;
  $('progBar').style.width=(done/total*100)+'%';$('progTxt').textContent=`${S.found.size} / 5 problems found · ${done} / ${total} solutions in action · ${solved} / 5 solved`}
const DONE={bycatch:'The longliners are now safe for albatrosses.',mice:'Marion is now free of mice.',warming:'Scientists and treaty partners are now tracking the warming ocean.',disease:'The disease is under control.',stowaway:'Biosecurity is in place, so no more stowaways can get through.'};
function stepRollout(dt){let changed=false;
  for(const p in PROBLEMS)PROBLEMS[p].sols.forEach(s=>{const st=S.sol[s[0]];if(st.state!=='rolling')return;st.m+=dt*MPS;
    if(st.m>=s[4]){st.state='done';changed=true;toast(fixFrac(p)>=1?DONE[p]:'In action: '+s[2])}});
  S.rt=(S.rt||0)+dt;if(changed){S.rt=0;renderPanel();checkWin()}else if(S.rt>.4){S.rt=0;if(Object.values(S.sol).some(x=>x.state==='rolling'))renderPanel()}}
let toastT;function toast(m){const t=$('toastEl');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3000)}

/* ===== loop ===== */
function hud(){$('pop').textContent=Math.round(S.pop).toLocaleString();const r=netRate()/MPS*12,t=$('trend');t.className='trend '+(r<0?'down':'up');
  t.textContent=r<0?`▼ losing ~${Math.abs(r).toFixed(0)}/yr`:`▲ recovering +${r.toFixed(0)}/yr`;const m=Math.floor(S.t*MPS);$('time').textContent=`Yr ${Math.floor(m/12)}`;$('timeSub').textContent=MOB?`month ${m%12+1}`:`month ${m%12+1} · 1 sec = ${MPS} months`}
let last=performance.now(),seaT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!S.paused&&!S.over){S.t+=dt;S.pop=Math.max(0,Math.min(9999,S.pop+netRate()*dt));seaT+=dt;stepRollout(dt);stepMap(dt);
    if(Math.floor(seaT*6)!==Math.floor((seaT-dt)*6))drawMapBg(seaT);if(S.scene==='marion')stepIsland(MAR,dt);if(S.scene==='pei')stepIsland(PEI,dt);if(S.pop<=0)gameOver()}
  hud();requestAnimationFrame(loop)}

/* ===== overlays ===== */
const yrs=()=>{const m=Math.floor(S.t*MPS);return `${Math.floor(m/12)} years ${m%12} months`};
function overlay(html){S.paused=true;$('overBox').innerHTML=html;$('over').classList.add('on')}
function closeOver(){$('over').classList.remove('on');if(!S.over)S.paused=false;last=performance.now()}
function gameOver(){S.over=true;overlay(`<h2 class="pix">THE COLONIES ARE GONE</h2><ul><li>Hooks, mice, disease, invaders and warming wiped out the Sooty Albatrosses on the Prince Edward Islands in ${yrs()}.</li><li>Albatrosses breed so slowly that once a colony is gone, it doesn't come back on its own.</li></ul><div class="row"><button class="hbtn" onclick="location.reload()">Try again</button></div>`)}
function checkWin(){if(S.won)return;if(Object.keys(PROBLEMS).every(p=>fixFrac(p)>=1)){S.won=true;
  overlay(`${head(SPR.bchick[0],'Plan complete','THE SOOTIES ARE SAVED!',true)}<ul><li>All 5 problems are solved, and the population is growing again by about ${(netRate()/MPS*12).toFixed(0)} birds a year.</li><li>It took ${yrs()}, and there are ${Math.round(S.pop).toLocaleString()} breeding adults left.</li><li>Because Sooty Albatrosses are K-selected, they recover slowly, so this plan would need to keep running for decades.</li></ul><div class="row"><button class="hbtn" onclick="showPlan()">See my plan as text</button><button class="hbtn w" onclick="closeOver()">Keep watching</button></div>`)}}
function planText(){let t='SPECIES SURVIVAL PLAN: SOOTY ALBATROSS (Phoebetria fusca), Prince Edward Islands\n\nSPECIES PROFILE\n';
  ['hab','food','life','surv','why','hot','esa','status'].forEach(k=>t+=`- ${FACT[k][0]}: ${FACT[k][1]}\n`);
  t+='\nPROBLEMS AND SOLUTIONS\n';for(const p in PROBLEMS){const P=PROBLEMS[p];if(!S.found.has(p)){t+='\n(Problem not found yet)\n';continue}
    t+=`\nPROBLEM: ${P.name.toUpperCase()}\n`+P.info.map(([a,b])=>`${a}: ${b}\n`).join('');
    t+=P.sols.map(s=>S.sol[s[0]].state==='none'?`- [${TYPES[s[1]]}] (not learned yet)\n`:`- [${TYPES[s[1]]}] ${s[2]} (${fmtM(s[4])} to put in place): ${s[3]}\n`).join('')}
  return t+`\nSOURCES\n${FACT.src[1]}\n`}
function showPlan(){const t=planText();overlay(`<h2 class="pix">MY PLAN</h2><p style="font-size:13px">Everything you have found so far. Select all and copy, or press Copy.</p><textarea id="planTA" readonly></textarea><div class="row"><button class="hbtn" id="cp2">Copy</button><button class="hbtn w" onclick="closeOver()">Close</button></div>`);
  $('planTA').value=t;$('cp2').onclick=async()=>{try{await navigator.clipboard.writeText(t);$('cp2').textContent='Copied!'}catch(e){$('planTA').select();$('cp2').textContent='Press Ctrl/Cmd+C'}}}
$('planBtn').onclick=showPlan;

/* ===== intro click-through ===== */
function miniMap(){const c=document.createElement('canvas');c.width=GW;c.height=GH;const x=c.getContext('2d');x.fillStyle='#1f4f80';x.fillRect(0,0,GW,GH);x.drawImage(landCanvas,0,0);
  const M=ISL.marion,P=ISL.pei,x0=Math.max(0,Math.floor((M.cx-M.rx*1.5)/4)),x1=Math.min(GW,Math.ceil((P.cx+P.rx*3)/4)),y0=Math.max(0,Math.floor((P.cy-P.ry*4)/4)),y1=Math.min(GH,Math.ceil((M.cy+M.ry*1.4)/4));
  const o=document.createElement('canvas');o.width=x1-x0;o.height=y1-y0;o.getContext('2d').drawImage(c,x0,y0,x1-x0,y1-y0,0,0,x1-x0,y1-y0);return o.toDataURL()}
const SLIDES=[
 ()=>({ph:'p1',cap:'Sooty Albatross in flight. Photo: Antoine Lamielle',kind:'1 · Meet the bird',title:'THE SOOTY ALBATROSS',body:`<ul>
   <li>The Sooty Albatross is a large seabird that lives in the Southern Ocean. It's about 85 cm long, and its wings stretch about 2 metres from tip to tip.</li>
   <li>It's sooty brown all over with a thin white crescent around each eye, and it can glide on the wind for hours without flapping.</li>
   <li>It feeds mostly on squid, along with crustaceans, fish and dead animals, which it finds far out over deep water.</li>
   <li>It is listed as <b>Endangered</b> because its numbers have dropped quickly.</li></ul>`}),
 ()=>({ph:'p2',map:true,cap:'A Sooty Albatross flying past sea cliffs. Photo: Antoine Lamielle',kind:'2 · Where they live',title:'THE PRINCE EDWARD ISLANDS',body:`<ul>
   <li>The Prince Edward Islands are two volcanic islands in the southern Indian Ocean, about 1,770 km southeast of Gqeberha (Port Elizabeth), South Africa, which puts them roughly halfway to Antarctica.</li>
   <li><b>Marion Island</b> is the bigger one at about 290 km², with a snowy peak over 1,200 m high. <b>Prince Edward Island</b> is about 45 km² and sits about 22 km to the northeast.</li>
   <li>The islands belong to South Africa, and the only people there are a small team of researchers on Marion.</li>
   <li>The weather is cold, windy and wet for almost the whole year, and the Sooties nest in the tussock grass on the slopes.</li></ul>`}),
 ()=>({ph:'p3',side:true,cap:'A Sooty Albatross chick on Marion Island. Photo: Luke Verburgt',kind:'3 · A long, slow life',title:'HOW THEY LIVE',body:`<ul>
   <li>Albatrosses are some of the longest-living birds in the world. One generation of Sooty Albatrosses is about 30 years, and related albatrosses have been seen breeding after age 50.</li>
   <li>Young birds spend several years at sea before coming back to breed.</li>
   <li>Pairs usually stay together for life and only lay one egg every other year.</li>
   <li>The fluffy chick stays on its nest for months while both parents fly far out to sea to bring back food.</li>
   <li>All of this makes them a <b>K-selected species</b>, so losing even a few adults is hard for the colony to recover from.</li></ul>`}),
 ()=>({ph:'p4',cap:'A Sooty Albatross over rough surf. Photo: Antoine Lamielle',kind:'4 · The trouble',title:'WHAT THEY ARE UP AGAINST',body:`<ul>
   <li>At sea, fishing boats with thousands of baited hooks catch and drown adult albatrosses.</li>
   <li>On land, mice that people brought to Marion attack chicks on their nests, and new pests could arrive hidden in cargo from supply ships.</li>
   <li>Disease can spread quickly through a colony of chicks.</li>
   <li>The climate is warming, which moves their food around and helps the mice survive.</li>
   <li>Right now there are about 5,328 breeding adults on these islands (1,454 pairs on Marion in 2023 and 1,210 pairs on Prince Edward in 2009).</li></ul>`}),
 ()=>({ph:'p5',cap:'Photo: Antoine Lamielle',kind:'5 · Your mission',title:'HOW TO PLAY',body:`<ul>
   <li>The <b>breeding adults</b> counter goes down every month that a problem is left unsolved, including problems you haven't found yet. Time moves quickly, with 1 second equal to ${MPS} months.</li>
   <li>There are <b>5 problems</b> to find, each marked with a red <b>!</b>. Two of them are out at sea, and the others only show up when you click on an island to zoom in.</li>
   <li>When you find a problem, a <b>helper</b> with a yellow <b>?</b> appears for each of its solutions. Click every helper to add their solution to your plan.</li>
   <li>Quick fixes take a few months, but long-term solutions like new laws or clearing mice off a whole island take years, so it helps to start those early.</li>
   <li>You can also click on albatrosses, chicks and the research station to learn more about the species. Solve all 5 problems to win.</li></ul>`}),
];
let slideI=0;
function showSlide(i){slideI=i;const s=SLIDES[i]();
  const cap=`<div class="cap">${s.cap}</div>`,title=`<div class="kind">${s.kind}</div><h2 class="pix" style="margin-bottom:4px">${s.title}</h2>`;
  let top;
  if(s.map)top=`<div class="ph2"><figure><img class="photo" src="${PH[s.ph]}" alt="Sooty Albatross">${cap}</figure><figure><img class="sprite" src="${miniMap()}" alt="Map of Marion and Prince Edward Islands" style="background:#1f4f80"><div class="cap">Big island: Marion · small island: Prince Edward</div></figure></div>${title}${s.body}`;
  else if(s.side)top=`<div class="side"><figure><img class="photo" src="${PH[s.ph]}" alt="Sooty Albatross chick">${cap}</figure><div>${title}${s.body}</div></div>`;
  else top=`<figure class="hero"><img class="photo" src="${PH[s.ph]}" alt="Sooty Albatross">${cap}</figure>${title}${s.body}`;
  overlay(`${top}<div class="row" style="justify-content:space-between;align-items:center"><div class="dots">${SLIDES.map((_,j)=>`<span class="${j===i?'on':''}"></span>`).join('')}</div>
   <div style="display:flex;gap:8px">${i>0?'<button class="hbtn w" onclick="showSlide(slideI-1)">◂ Back</button>':''}${i<SLIDES.length-1?'<button class="hbtn" onclick="showSlide(slideI+1)">Next ▸</button>':'<button class="hbtn" onclick="closeOver()">Start!</button>'}</div></div>`)}
$('howBtn').onclick=()=>showSlide(0);

 ['ACAP, Summary Advice for Reducing Impact of Pelagic Longlines on Seabirds','https://www.bmis-bycatch.org/system/files/zotero_attachments/library_1/FAVC9W4W%20-%20ACAP%202014%20PELAGIC%20LL%20Mitigation%20Review%20%26%20Advice_e.pdf'],
 ['BirdLife International, Sooty Albatross Species Factsheet','https://datazone.birdlife.org/species/factsheet/sooty-albatross-phoebetria-fusca/summary'],

 ['Luke Verburgt, Sooty Albatross chick on Marion Island (CC BY-NC), iNaturalist','https://www.inaturalist.org/observations/128496628'],

 ['Albatross chick photo (photographer\'s watermark on original)',''],
];
$('creditBtn').onclick=()=>overlay(`<h2 class="pix">SOURCES</h2><ul class="credits">${SOURCES.map(([t,u])=>`<li>${u?`<a href="${u}" target="_blank" rel="noopener">${t}</a>`:t}</li>`).join('')}</ul><div class="row"><button class="hbtn" onclick="closeOver()">Close</button></div>`);

$('panelTop').onclick=()=>{if(!MOB)return;const o=$('panel').classList.toggle('open');$('chev').textContent=o?'▼':'▲'};

$('badgeImg').src=SPR.bchick[0];
buildAll();renderPanel();requestAnimationFrame(loop);showSlide(0);
